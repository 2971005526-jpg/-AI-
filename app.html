function discover(){const cities=[{name:'成都',fly:'直飞往返',price:'预计 ¥900 起',adv:['<em>松弛烟火</em>的慢生活','日均 22℃ 舒适','喝茶发呆、看熊猫都不赶'],fun:['大熊猫基地 宽窄巷子','锦里 都江堰 太古里','钵钵鸡 火锅 甜水面'],action:"generatePlanInChat()"},{name:'大理',fly:'直飞往返',price:'预计 ¥950 起',adv:['<em>山海之间</em>的自然风光','洱海边凉爽惬意','适合朋友闺蜜放空'],fun:['洱海环线 双廊古镇','苍山 喜洲 崇圣寺三塔','乳扇 破酥粑粑 梅子酒'],action:"cityInfo('大理')"},{name:'西安',fly:'直飞往返','price':'预计 ¥880 起',adv:['<em>千年长安</em>的历史人文','古今交错很出片','亲子人文都合适'],fun:['兵马俑 西安城墙','大唐不夜城 回民街','肉夹馍 油泼面 酸汤水饺'],action:"cityInfo('西安')"}];return header()+`<section class="page"><div class="request">十一有 4 天，去哪儿玩？</div><div class="assistant-tag">${icon('spark')}京旅为你推荐</div><h1>十一四天，按城市帮你挑几个好去处。</h1><p class="lede">从热门目的地里挑了三座城，<br>看看哪一种假期，更合你的心意。</p><div class="city-table"><table><thead><tr><th class="col-city">目的地</th><th class="col-adv">优势</th><th>好吃 好玩</th></tr></thead><tbody>${cities.map(c=>`<tr onclick="${c.action}"><td class="col-city"><div class="city-name">${c.name}</div><div class="city-way">${c.fly}<br><span class="city-price">${c.price}</span></div></td><td class="col-adv"><div class="city-adv">${c.adv.join('<br>')}</div></td><td><div class="city-fun">${c.fun.join('<br>')}</div></td></tr>`).join('')}</tbody></table></div><div class="quick-asks">${[{t:'成都亲子游详细路线',a:"go('plan')"},{t:'大理洱海环线怎么安排',a:"cityInfo('大理')"},{t:'西安适合儿童的博物馆推荐',a:"cityInfo('西安')"}].map(q=>`<button class="quick-ask" onclick="${q.a}">${icon('spark')}${q.t}</button>`).join('')}</div><div class="soft-followup">${icon('spark')}如果有感兴趣的地点或者其他要求可以告诉我，为您生成更加详细的旅途规划</div></section>`+composer()}
function dayMarkup(day){const list=spots.filter(s=>selected.has(s.id)&&s.day===day);return `<details class="day" ${day===1?'open':''} style="--c:${colors[day-1]}"><summary><span class="day-badge">DAY<b>${day.toString().padStart(2,'0')}</b></span><div><div class="day-name">${titles[day-1]}</div><div class="day-sub">${list.length?list.map(s=>s.name).join(' · '):'留白的一天，随心安排'}</div></div>${icon('down')}</summary><div class="day-body">${(()=>{const r=dayReason(day);return r?`<div class="day-reason">${icon('spark')}${r}</div>`:''})()}<div class="stop-line">${list.map((s,idx)=>`${idx>0?`<div class="stop-leg"><span class="leg-track"></span><span class="leg-text">${legInfo(list[idx-1].id,s.id)}</span></div>`:''}<div class="stop"><span class="stop-num">${s.id}</span><span class="stop-name">${s.name}</span></div>`).join('')}</div>${day===4?`<div class="stop">${incomplete?'当天安排可随返程时间调整':'预留前往机场的时间'}</div>`:''}</div></details>`}

const money=n=>n.toLocaleString('zh-CN');
const outboundOffer=()=>chosenOutbound===-1?earlyOffer:flightOffers[chosenOutbound];

function singleFlightCard(direction){const out=direction==='out',chosen=out?chosenOutbound:chosenReturn;return `<div class="cart-row-title">${out?'去程机票 · 10 月 1 日':'返程机票 · 10 月 4 日'}<span>${out?'4 个方案':'3 个方案'} · 左右滑动</span></div><div class="offer-row" role="radiogroup" aria-label="${out?'去程':'返程'}机票方案">${flightOffers.map((f,i)=>{const times=out?f.out:f.back,ports=out?f.airport:[...f.airport].reverse();return `<label class="offer"><input type="radio" name="${direction}" value="${i}" ${i===chosen?'checked':''} onchange="chooseOffer('${direction}',${i})"><div class="offer-top">${out?f.name:f.returnName}<span class="choice-mark">${icon('check')}</span></div><div class="offer-sub">${out?'北京 → 成都':'成都 → 北京'} · 直飞 · 经济舱</div><div class="offer-tags"><span>${out?['相对省','时间体面','直飞省心'][i]:['不占游玩','不熬夜返程','衔接顺畅'][i]}</span><span>${out?['上午抵达','直飞省心','衔接顺畅'][i]:['直飞省心','时间体面','时间体面'][i]}</span></div><div class="flight-leg"><div class="flight-hours">${times[0]}<span>直飞</span>${times[1]}</div><div class="flight-airports"><span>${ports[0]}</span><span>${ports[1]}</span></div></div><div class="offer-policy">${f.baggage}<br>${f.policy}<br>改签另补票价差额</div><div class="offer-cost"><em>¥</em>${money(out?f.outPrice:f.backPrice)} <small>/ 人 · 单程含税</small></div></label>`}).join('')}${out?earlyFlightCard():''}</div>`}
function earlyFlightCard(){const f=earlyOffer,chosen=chosenOutbound===-1;return `<label class="offer offer-early"><input type="radio" name="out" value="-1" ${chosen?'checked':''} onchange="chooseOffer('out',-1)"><div class="offer-top">${f.name}<span class="choice-mark">${icon('check')}</span></div><div class="offer-sub">9 月 30 日 · 北京 → 成都 · 直飞</div><div class="offer-tags"><span class="tag-early">提前出发</span><span>不占游玩</span></div><div class="flight-leg"><div class="flight-hours">${f.out[0]}<span>直飞</span>${f.out[1]}</div><div class="flight-airports"><span>${f.airport[0]}</span><span>${f.airport[1]}</span></div></div><div class="offer-policy">${f.baggage}<br>${f.policy}<br>改签另补票价差额</div><div class="offer-cost"><em>¥</em>${money(f.outPrice)} <small>/ 人 · 单程含税</small></div></label>`}
function cartMarkup(){return `<section class="booking-cart" id="trip-cart"><div class="cart-heading"><h2>预订清单</h2><span class="cart-benefit-tag">早订早省 · 行变可退</span></div><div class="combo-reason" id="combo-reason" aria-live="polite">${comboReason()}</div><div class="cart-adjust">你也可以根据自己的需求进行调整，<br>去程、返程和酒店各选一个，自由搭配。</div>${singleFlightCard('out')}${singleFlightCard('back')}<div class="cart-row-title">入住酒店 <span>3 家住处 · 左右滑动</span></div><div class="offer-row" role="radiogroup" aria-label="酒店方案">${hotelOffers.map((h,i)=>`<label class="offer"><input type="radio" name="hotel" value="${i}" ${i===chosenHotel?'checked':''} onchange="chooseOffer('hotel',${i})"><div class="offer-top">${h.name}<span class="choice-mark">${icon('check')}</span></div><div class="offer-sub">${h.desc}</div><div class="offer-tags">${[["相对省","离行程近"],["离行程近","口碑之选"],["舒适住宿","高星优选"]][i].map(t=>`<span>${t}</span>`).join('')}</div><div class="stay-dates"><div><small>入住 · 14:00 后</small><strong>10.01</strong></div><span>3 晚</span><div><small>离店 · 12:00 前</small><strong>10.04</strong></div></div><div class="room-info">${h.room}<br>${h.meal}</div><div class="offer-policy">${h.policy}<br>逾期取消收取首晚房费</div><div class="offer-cost"><em>¥</em>${money(h.price)} <small>/ 间 · 3 晚总价</small></div></label>`).join('')}</div><div class="cart-total" id="cart-total" aria-live="polite">${cartSummary()}</div><div class="cart-disclaimer">原型示例：按 1 位成人、1 间房计算。以上酒店、航班时间、价格与退改条款仅用于展示，未接入实时库存。</div></section>`}
function comboReason(){const o=outboundOffer(),r=flightOffers[chosenReturn],h=hotelOffers[chosenHotel];const first=chosenOutbound===0&&chosenReturn===0&&chosenHotel===0;return `<p class="combo-brief">已帮你避开红眼与绕路：全程直飞、住处贴着行程，首尾两天都不浪费。</p><p class="combo-brief">按常见偏好先搭了一套性价比方案，任意一项都能随时替换。</p><div class="combo-chips"><span>已避开红眼绕路</span><span>性价比优先</span></div>`}
function cartSummary(){return `<div class="cart-selection-line"><div class="cart-selected"><strong>已选机票 + 酒店</strong>去程 ¥${money(outboundOffer().outPrice)} + 返程 ¥${money(flightOffers[chosenReturn].backPrice)} · 1 人<br>${hotelOffers[chosenHotel].name.split(' · ')[0]} · 1 间 / 3 晚</div><button class="summary-details" onclick="booking()">明细 ›</button></div><div class="cart-checkout-line"><div class="cart-sum"><span>组合合计</span><div class="total-price"><small>¥</small>${money(cartTotal())}</div></div><button class="checkout-button" onclick="reserveTrip()">点击预定</button></div>`}

function chooseOffer(kind,index){if(!['out','back','hotel'].includes(kind)||!Number.isInteger(index)||index<-1||index>2||(kind!=='out'&&index<0))throw new Error('Invalid offer');if(kind==='out')chosenOutbound=index;else if(kind==='back')chosenReturn=index;else chosenHotel=index;document.getElementById('cart-total').innerHTML=cartSummary();document.getElementById('combo-reason').innerHTML=comboReason()}


function legInfo(from,to){const map={'1-2':'步行 8 分钟','2-3':'打车 12 分钟','4-5':'驾车 1 小时','6-7':'地铁 20 分钟','6-10':'打车 15 分钟','10-7':'打车 25 分钟'};return map[from+'-'+to]||'车程约 20 分钟';}
function dayReason(day){const has=id=>selected.has(id);
if(day===1){if(has(1)&&has(2))return '宽窄巷子和人民公园是老成都最有味道的地方，从闲逛、喝茶开始，先把旅行节奏放慢'+(has(3)?'；锦里留到入夜，灯笼亮起时最好看。':'。');if(has(1)||has(2)||has(3))return '以市区闲逛为主，给抵达和休息留些余裕。';}
if(day===2){if(has(4)&&has(5))return '熊猫基地清晨最活跃，建议上午先去；都江堰的千年古堰值得慢看，两处同在西北方向可顺路，但跨区域交通较多，想更轻松也可二选一。';if(has(4))return '熊猫清晨最活跃，安排在上午能看到它们进食，建议早出发。';if(has(5))return '都江堰值得留出较完整的时间慢看，别和市区景点挤在一起。';if(has(9))return '青城山山间清幽，约需半天，可替换当天部分安排。';}
if(day===3){if(has(6)&&has(7))return '武侯祠的红墙竹影适合读一段三国，太古里则是成都的潮流一面；一天里从历史切到城市生活，可按体力调整逛街时间。';if(has(10))return '杜甫草堂的竹林庭院适合慢逛，加入后可缩短当天商圈时间。';}
if(day===4)return incomplete?'东郊记忆的老厂房适合随意逛逛；作为行程尾声先留白，具体安排会在确认返程时间后调整。':'东郊记忆的老厂房适合随意逛逛，作为行程尾声留些余裕，记得预留前往机场的时间。';
return '';}

function setTripTab(t){tripTab=t;render()}
function tripCard(t){const done=t.progress>=100;const bar=`<div class="trip-bar-head"><span class="trip-bar-label">行程完善度</span><span class="trip-bar-num ${done?'done':''}">${t.progress}%</span></div><div class="trip-bar"><i style="width:${t.progress}%"></i></div>`;const guide=done?`<div class="trip-guide done"><div class="trip-guide-text"><strong>行程已完善，随时可出发</strong><small>机票、酒店与每日安排都已就绪</small></div><button class="trip-book" onclick="toast('正在为「'+${JSON.stringify(t.title)}+'」生成一键预订清单')">一键预订出行</button></div>`:`<div class="trip-guide"><div class="trip-guide-text"><strong>还差一点就能出发，点击详细行程规划去完善</strong><small>待补充：${t.missing.join('、')}</small></div></div>`;const hero=`<div class="trip-hero"><img src="${imageAssets[t.cover]}" alt=""><div class="trip-hero-mask"></div><span class="trip-hero-days">${t.days}</span><div class="trip-hero-spots">${t.spots.map(s=>`<span>${s}</span>`).join('')}</div></div>`;return `<article class="trip-card"><div class="trip-card-top"><span class="trip-mood">行程种草 · ${t.mood}</span><button class="trip-edit-btn" onclick="location.hash='edit'">详细行程规划 ${icon('arrow')}</button></div>${bar}<h3 class="trip-card-title">${t.title}</h3>${hero}${guide}</article>`}
function ongoingTrip(){return `<div class="og-hero"><div><div class="og-tag">行程安排 进行中</div><div class="og-route">北京 - 西安 · 9月30日出发</div></div><button class="og-guide" onclick="toast('打开攻略')">攻略</button></div><div class="og-day">9月30日 周三 · 北京</div><div class="og-tl"><div class="og-node"><div class="og-card"><div class="og-flight-h">${icon('spark')}去程机票 · 9月30日 周三 · <b>北京 → 西安</b></div><div class="og-flight-t"><div><div class="t-time">06:45</div><div class="t-air">大兴 T3</div></div><div class="t-mid"><span>总3h5m</span></div><div style="text-align:right"><div class="t-time">09:50</div><div class="t-air">咸阳国际 T3</div></div></div><div class="og-flight-meta">长龙 GJ8067 空客321（中型机）· 经济舱 2.6折 <span class="cut">退改¥485起</span> · 托运行李20公斤</div><div class="og-actions"><span onclick="toast('订单详情')">订单详情</span><span onclick="toast('联系酒店')">联系酒店</span><span onclick="toast('入住必读')">入住必读</span><span onclick="toast('确认函')">确认函</span><span onclick="toast('更多')">更多</span></div></div></div></div><div class="og-day">9月30日 周三 · 西安</div><div class="og-tl"><div class="og-node"><div class="og-rent"><span>${icon('spark')} 租车开至机场接机</span><button onclick="toast('立即租车')">立即租车</button></div></div><div class="og-node"><div class="og-card og-hotel"><img class="h-img" src="${imageAssets.chengdu}" alt="酒店"><div><div class="h-name">西安大雁塔希尔顿欢朋酒店</div><div class="h-score">4.9分 · <b>超棒</b> · 9月30日18:00前 免费取消</div><div class="h-dist">距离大雁塔步行735米 · 14分钟</div><div class="h-desc">舒适、景点集中，夜里散步就是夜景。孩子走累了随时回酒店。</div></div></div></div></div><div class="og-day">10月1日 周四 · 西安</div><div class="og-tl"><div class="og-node"><div class="og-card og-spot"><div class="s-h">${icon('spark')} 秦始皇兵马俑博物院</div><div class="s-time">建议 09:00 到馆 · 游览 3 小时</div><div class="s-desc">一号坑最震撼，先看馆再看坑，跟着讲解更懂。</div><div class="og-tips">${icon('spark')}<div><b>提前预约：</b>需实名预约，节假日名额紧张，建议提前 1-2 天在官方公众号购票；开馆前 30 分钟到检票口更从容。</div></div></div></div><div class="og-node"><div class="og-card og-spot"><div class="s-h">${icon('spark')} 西安城墙 · 永宁门骑行</div><div class="s-time">建议 16:00 前往 · 骑行 1.5 小时</div><div class="s-desc">登城墙租辆自行车，绕一圈看夕阳，孩子会很喜欢。</div><div class="og-tips">${icon('spark')}<div><b>购票提示：</b>城墙门票与自行车分开收费，现场可租；傍晚风大，给孩子带件外套。</div></div></div></div></div><div class="og-day">10月2日 周五 · 西安</div><div class="og-tl"><div class="og-node"><div class="og-card og-spot"><div class="s-h">${icon('spark')} 陕西历史博物馆</div><div class="s-time">建议 09:30 入馆 · 游览 2.5 小时</div><div class="s-desc">中国古代文明的浓缩，配合语音讲解，孩子也能读懂一座城。</div><div class="og-tips">${icon('spark')}<div><b>提前预约：</b>免费不免票，需提前在官方小程序预约当日或次日名额，热门时段秒空；珍宝馆（何家村窖藏）单独购票，值得看。</div></div></div></div><div class="og-node"><div class="og-card og-spot"><div class="s-h">${icon('spark')} 回民街 · 大皮院</div><div class="s-time">建议 14:00 前往 · 逛吃 2 小时</div><div class="s-desc">避开主街人流，往大皮院、洒金桥走，更地道也更好逛。</div><div class="og-tips">${icon('spark')}<div><b>小提示：</b>人多注意看管随身物品；孩子肠胃敏感，油炸类适量尝鲜即可。</div></div></div></div></div><div class="og-day">10月3日 周六 · 返程</div><div class="og-tl"><div class="og-node"><div class="og-card"><div class="og-flight-h">${icon('spark')}<span class="rt">返程机票</span> · 10月3日 周六 · <b>西安 → 北京</b></div><div class="og-flight-t"><div><div class="t-time">15:20</div><div class="t-air">咸阳国际 T3</div></div><div class="t-mid"><span>总2h55m</span></div><div style="text-align:right"><div class="t-time">18:15</div><div class="t-air">大兴 T3</div></div></div><div class="og-flight-meta">东航 MU2157 空客320（中型机）· 经济舱 3.2折 <span class="cut">退改¥520起</span> · 托运行李20公斤</div><div class="og-tips">${icon('spark')}<div><b>退房与赶机：</b>建议 12:00 前退房，咸阳机场距市区约 1 小时车程，提前 2 小时到机场值机更稳妥。</div></div></div></div></div>`}
function trips(){return header()+`<section class="page trips-page"><h1 class="trips-h1">行程</h1><div class="trips-tabs"><button class="trips-tab ${tripTab==='draft'?'active':''}" onclick="setTripTab('draft')">种草行程</button><button class="trips-tab ${tripTab==='ongoing'?'active':''}" onclick="setTripTab('ongoing')">进行中</button></div>${tripTab==='draft'?tripDrafts.map(tripCard).join(''):ongoingTrip()}</section>`}
function routeReason(){const has=id=>selected.has(id);return `<section class="route-reason"><div class="assistant-tag">${icon('spark')}这样安排，玩得更从容</div><p>四天把${has(4)?'熊猫、':''}老成都生活、历史文化与城市闲逛穿插开，松紧交替，也给休息和自由活动留了空档。</p></section>`}
function planBody(){return `<section class="page"><div class="eyebrow">YOUR LITTLE GETAWAY</div><h1>成都，慢慢玩四天。</h1><div class="trip-meta">${incomplete?'<span>成都</span><span>4 天玩法参考</span>':'<span>北京出发</span><span>10.01—10.04</span><span>4 天 3 晚</span>'}</div><p class="lede">喝茶、看熊猫，也给闲逛留点时间。<br>先看看这些地方，再按你的喜好调整。</p><div class="title-row"><h2>把想去的地方放在一起</h2><button class="text-button" onclick="go('edit')">${selected.size} 个景点 ${icon('arrow')}</button></div>${routeReason()}${mapMarkup()}<div class="title-row"><h2>每天，都有一点期待</h2><span style="font-size:11px;color:#a4aab3">点开查看安排</span></div><div class="day-list">${[1,2,3,4].map(dayMarkup).join('')}</div>${incomplete?softAsk():cartMarkup()+bookingSoftAsk()}<div class="followups"><button class="chip" onclick="go('edit')">调整某一天</button><button class="chip" onclick="showHint('带孩子，节奏放慢')">带孩子，节奏放慢</button><button class="chip" onclick="showHint('加一条美食路线')">加一条美食路线</button></div></section>`}
function plan(){return header()+planBody()+composer()}
function scrollChatEnd(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}
function generatePlanInChat(){const app=document.getElementById('app');const page=app.querySelector('.page');if(!page||page.dataset.planning==='1')return;page.dataset.planning='1';page.querySelectorAll('.city-table tr').forEach(tr=>tr.onclick=null);const req=document.createElement('div');req.className='request req-self';req.textContent='就选成都吧，帮我安排 4 天亲子行程';page.appendChild(req);const typing=document.createElement('div');typing.className='assistant-tag';typing.innerHTML=icon('spark')+'京旅正在为你规划<span class="dots"><i></i><i></i><i></i></span>';page.appendChild(typing);scrollChatEnd();setTimeout(()=>{typing.innerHTML=icon('spark')+'好的，成都 4 天亲子行程排好了';const lede=document.createElement('p');lede.className='lede chat-reply';lede.innerHTML='按“松弛不赶路”的思路，把熊猫、老成都和城市闲逛穿插开，给孩子留足休息和自由活动的时间。<br>先看看下面这份安排，可以随时调整。';page.appendChild(lede);scrollChatEnd();setTimeout(()=>{const wrap=document.createElement('div');wrap.className='plan-in-chat';wrap.innerHTML=planBody();page.appendChild(wrap);current='plan';scrollChatEnd()},900)},1200)}
function spotMarkup(s){const yes=selected.has(s.id);return `<article class="spot"><div class="spot-icon">${icon(s.kind)}</div><div class="spot-main"><h3>${s.name}</h3><p>${s.desc}</p><small>建议游玩 ${s.time}</small></div><button class="select-btn ${yes?'selected':''}" aria-label="${yes?'移除':'加入'}${s.name}" aria-pressed="${yes}" onclick="toggleSpot(${s.id})">${icon(yes?'check':'plus')}</button></article>`}
function edit(){let main=spots.filter(s=>s.day===activeDay&&s.id<=8),recs=spots.filter(s=>s.day===activeDay&&s.id>8);return header(true)+`<section class="page edit-page"><div class="edit-head"><span class="kicker">行程种草<b>今年一定去</b></span><button class="invite-btn" onclick="toast('已邀请家人一起编辑')">邀请家人编辑</button></div><h1 class="edit-title">成都 · 慢下来的巴适之旅</h1><div class="plan-idea"><div class="pi-head"><h3>出行思路</h3><button class="pi-edit" onclick="location.hash='plan'">修改</button></div><div class="pi-tags"><span>4天</span><span>10月1日</span><span>成都出发</span><span>宽松节奏</span></div><p class="pi-desc">2大1小，孩子7岁，每天一个主要活动，酒店3晚连住不挪窝；优先选择限时可退房型，并给热门活动留出预约与替代空间。</p><div class="pi-status"><span class="ok">路线合理性已检查</span><span class="wait">时节与天气待查询</span></div></div>${mapMarkup(true)}<div class="tabs" role="tablist" aria-label="选择日期">${[1,2,3,4].map(d=>`<button class="tab ${d===activeDay?'active':''}" role="tab" id="tab${d}" aria-selected="${d===activeDay}" aria-controls="day-panel" tabindex="${d===activeDay?0:-1}" onclick="setDay(${d})" onkeydown="tabKey(event,${d})">第 ${d} 天</button>`).join('')}</div><div role="tabpanel" id="day-panel" aria-labelledby="tab${activeDay}"><div class="edit-day-head"><h2>${titles[activeDay-1]}</h2><span>${spots.filter(s=>s.day===activeDay&&selected.has(s.id)).length} 个已选</span></div><div class="spot-list">${main.map(spotMarkup).join('')}</div>${recs.length?`<div class="section-label">也可以去这里</div><div class="spot-list">${recs.map(spotMarkup).join('')}</div>`:''}</div><button class="more" onclick="moreSpots()">${icon('refresh')}看看其他景点</button></section>`}
function route(){const raw=location.hash.slice(1)||'discover';const next=raw==='plan-incomplete'?'plan':raw;if(raw==='plan-incomplete')incomplete=true;else if(raw==='plan')incomplete=false;if(!['discover','plan','edit','trips'].includes(next)){location.hash='discover';return}current=next;render();window.scrollTo(0,0)}
function render(){document.getElementById('app').innerHTML=({discover,plan,edit,trips})[current]();document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===(current==='plan'&&incomplete?'plan-incomplete':current)))}
function go(page){if(page===current){render();return}location.hash=page==='plan'&&incomplete?'plan-incomplete':page}
function setDay(d){activeDay=d;const y=window.scrollY;render();window.scrollTo(0,y)}
function tabKey(e,d){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();let n=(d-1+(e.key==='ArrowRight'?1:3))%4+1;setDay(n);document.getElementById('tab'+n).focus()}}
function toggleSpot(id){if(!spots.some(s=>s.id===id))throw new Error('Unknown attraction');selected.has(id)?selected.delete(id):selected.add(id);const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`[onclick="toggleSpot(${id})"]`)?.focus({preventScroll:true})}
function leaveEdit(){go('plan')}
let toastTimer;function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function modal(html){document.getElementById('dialog-body').innerHTML=html;document.getElementById('dialog').showModal()}
function closeModal(){document.getElementById('dialog').close()}
function compare(){modal('<h2>哪一种假期更适合你？</h2><div class="comparison"><b>成都 · 松弛烟火</b><br>喝茶、看熊猫，喜欢城市慢生活可以选它。</div><div class="comparison"><b>大理 · 自然风光</b><br>环洱海、看苍山，想亲近自然可以选它。</div><div class="comparison"><b>西安 · 历史人文</b><br>看古迹、逛城墙，喜欢历史故事可以选它。</div><button class="primary" onclick="closeModal();go(\'plan\')">先看看成都的四天</button>')}
function cityInfo(name){modal(`<h2>${name}，也很值得期待。</h2><p>这份原型以成都为例，展示完整的行程规划与景点调整。</p><button class="primary" onclick="closeModal();go('plan')">体验成都行程</button>`)}
function combinationDetail(){const o=outboundOffer(),r=flightOffers[chosenReturn],h=hotelOffers[chosenHotel];return `<div class="comparison"><b>去程 · ${o.name}</b><br>10.01 ${o.out[0]}—${o.out[1]}<br>${o.airport[0]} → ${o.airport[1]} · ¥${money(o.outPrice)}<br><br><b>返程 · ${r.returnName}</b><br>10.04 ${r.back[0]}—${r.back[1]}<br>${r.airport[1]} → ${r.airport[0]} · ¥${money(r.backPrice)}<br><br><b>${h.name}</b><br>10.01 入住 — 10.04 离店<br>${h.room} · 3 晚 · ¥${money(h.price)}</div><h2>合计 ¥${money(cartTotal())}</h2>`}
function reserveTrip(){modal(`<h2>确认预定组合</h2>${combinationDetail()}<p>当前为原型演示，尚未接入下单和支付，不会产生实际订单。</p><button class="primary" onclick="closeModal()">返回方案</button>`)}
function booking(){if(incomplete){askTripInfo();return}modal(`<h2>你的机酒组合</h2>${combinationDetail()}<p>原型示例组合，暂未接入实时查询与预订。</p><button class="primary" onclick="closeModal()">继续搭配</button>`)}
function showHint(text){modal(`<h2>${text}</h2><p>你可以先在地图里增减景点，调整每一天的安排。对话式智能规划将在后续接入。</p><button class="primary" onclick="closeModal();go('edit')">调整景点</button>`)}
function moreSpots(){let rec=activeDay===2?3:2;setDay(rec);toast(rec===2?'看看青城山，也可以替换当天景点':'看看杜甫草堂，为行程留一点安静')}
function pageMenu(){modal('<h2>京旅 · 交互原型</h2>'+['目的地推荐','成都行程 · 信息齐全','种草行程详情页','成都行程 · 待补充信息'].map((t,i)=>`<button class="chip" style="width:100%;margin-top:12px" onclick="closeModal();${i===1?'switchScenario(false)':i===3?'switchScenario(true)':`go('${['discover','plan','edit','plan-incomplete'][i]}')`}">0${i+1}　${t}</button>`).join('')+'<button class="text-button" onclick="credits()" style="margin-top:20px">图片来源</button>')}
function credits(){closeModal();modal(`<h2>图片来源</h2><p>成都：Daderot / CC0<br>大理：Jason Zhang / CC BY-SA 3.0<br>西安：Maros Mraz / CC BY-SA 3.0</p><p style="margin-top:15px">图片均来自 Wikimedia Commons，以缩略图和容器裁切展示。</p><p><a href="https://commons.wikimedia.org/wiki/File:Teahouse_in_Peoples_Park_-_Chengdu,_China_-_DSC05371.jpg" target="_blank" rel="noopener">成都来源</a> · <a href="https://commons.wikimedia.org/wiki/File:Erhai_Lake_town,_view_from_above.jpg" target="_blank" rel="noopener">大理来源</a> · <a href="https://commons.wikimedia.org/wiki/File:Xi'an_-_City_wall_-_013.jpg" target="_blank" rel="noopener">西安来源</a></p><p><a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0 许可</a></p>`)}
function sendMessage(e){e.preventDefault();let input=e.target.querySelector('input'),text=input.value.trim();if(!text)return;if(/成都/.test(text)){go('plan')}else if(/对比|比较/.test(text)){compare()}else if(/调整|景点/.test(text)){go('edit')}else{toast('当前为视觉原型，可先体验成都行程与景点调整')}input.value=''}
document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});window.addEventListener('hashchange',route);route();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_trip_prototype',description:'Read the selected attractions in the current Chengdu trip prototype.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({page:current,attractions:spots.filter(s=>selected.has(s.id)).map(({id,name,day})=>({id,name,day}))})})).catch(()=>{})}catch(e){}}
</script>
</body></html>
